name: Release

# Runs only on a version tag or by hand, never on pull requests (secrets stay unreachable for outsiders).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms.

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the signing secrets are set
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done

      - name: Restore the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableRelease --no-daemon --console=plain

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signing certificate (public information only)
        env:
          EXPECTED_SHA256: FA:31:29:AA:A3:43:38:FE:86:C2:39:25:92:E1:4D:03:A8:0C:1C:85:1D:9C:66:D3:D9:B4:A2:12:ED:CC:88:15
        run: |
          apk=$(ls app/build/outputs/apk/stable/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "APK: $apk"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -E "certificate (DN|SHA-256)"
          actual=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ "$actual" != "$EXPECTED_SHA256" ] && [ "$(echo "$actual" | tr -d ':')" != "$(echo "$EXPECTED_SHA256" | tr -d ':')" ]; then
            echo "::error::Signing certificate does not match the expected fingerprint"
            exit 1
          fi
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ForPDAFFF-release
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error

      - name: Publish a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" app/build/outputs/apk/stable/release/*.apk \
            --title "${{ github.ref_name }}" --generate-notes

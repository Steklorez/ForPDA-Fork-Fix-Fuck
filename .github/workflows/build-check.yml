name: Build check

# Plain debug build with the public debug key. No secrets are used or needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build devDebug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --no-daemon --console=plain
